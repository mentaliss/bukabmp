name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BMP_API_BASE_URL: https://community.bukabmp.workers.dev
      BMP_TELEGRAM_CHANNEL_URL: https://t.me/bukabmp
      BMP_TELEGRAM_GROUP_URL: https://t.me/+0pAg9ymEhWdkZmNl
      SOURCE_DATE_EPOCH: "1790926581"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension source
        run: npm run validate

      - name: Check tag matches manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test "${VERSION}" = "1.2.0"

      - name: Build audited Chrome payload
        run: npm run build:release

      - name: Validate audited Chrome payload
        run: npm run validate:github

      - name: Verify exact frozen runtime payload
        shell: bash
        run: |
          set -euo pipefail
          cd dist/BMP-Terbuka-v1.2.0
          sha256sum -c ../../release/v1.2.0-frozen-payload.sha256

      - name: Package public Chrome ZIP with DEFLATE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("dist/BMP-Terbuka-v1.2.0")
          out=pathlib.Path("dist/BMP-Terbuka-v1.2.0.zip")
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      arc=(pathlib.Path(root.name)/p.relative_to(root)).as_posix()
                      z.write(p,arc,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
              bad=[i.filename for i in z.infolist() if not i.is_dir() and i.compress_type!=zipfile.ZIP_DEFLATED]
              if bad: raise SystemExit("non-DEFLATE entries: "+", ".join(bad))
          PY
          sha256sum dist/BMP-Terbuka-v1.2.0.zip > dist/BMP-Terbuka-v1.2.0.zip.sha256
          unzip -t dist/BMP-Terbuka-v1.2.0.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.2.0             dist/BMP-Terbuka-v1.2.0.zip             dist/BMP-Terbuka-v1.2.0.zip.sha256             --verify-tag             --title "BMP Terbuka v1.2.0"             --notes-file release/v1.2.0-notes.md
