name: Validate current tutorial sync

on:
  push:
    branches: ["website-current-tutorial-sync"]
    paths:
      - ".github/workflows/current-tutorial-sync-validation.yml"
      - "content/**"
      - "site/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BMP_SITE_BASE_PATH: /bukabmp
      BMP_SITE_URL: https://mentaliss.github.io/bukabmp
      BMP_EDGE_ADDONS_URL: https://microsoftedge.microsoft.com/addons/detail/mkgmigiagipmfdlppehhmckfokmpnmlm
      BMP_BUSINESS_CONTACT_URL: https://t.me/bukabmp
      BMP_GITHUB_ZIP_URL: https://github.com/mentaliss/bukabmp/releases/download/v1.2.0/BMP-Terbuka-v1.2.0.2-github.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build:site
      - run: npm run validate:site
      - name: Tutorial contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "https://t.me/bukabmp/32" content/id/install.md
          grep -Fq "https://t.me/bukabmp/32" content/id/download.md
          grep -Fq "https://t.me/bukabmp/35" content/id/download.md
          grep -Fq "https://t.me/bukabmp/32" content/en/install.md
          grep -Fq "https://t.me/bukabmp/35" content/en/download.md
          ! grep -Fq "https://t.me/bukabmp/11?comment=294" content/id/install.md
          ! grep -Fq "https://t.me/c/4381494564/18" content/id/install.md
          ! grep -Fq "Tutorial Lama" content/id/install.md
