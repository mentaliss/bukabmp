name: Public Branch Cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/public-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every public branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${REPO}/branches?per_page=100"               --jq '.[].name'               | sort
          )

          echo "Before cleanup:"
          printf '  %s\n' "${branches[@]}"

          for branch in "${branches[@]}"; do
            if [ "$branch" = "main" ]; then
              continue
            fi
            encoded="${branch//\//%2F}"
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${encoded}"
          done

          mapfile -t remaining < <(
            gh api --paginate "repos/${REPO}/branches?per_page=100"               --jq '.[].name'               | sort
          )

          echo "Remaining:"
          printf '  %s\n' "${remaining[@]}"

          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = "main"
