name: One-shot v1.1.0.1 release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v1.1.0.1-now.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BMP_API_BASE_URL: https://community.bukabmp.workers.dev
      BMP_TELEGRAM_CHANNEL_URL: https://t.me/bukabmp
      BMP_TELEGRAM_GROUP_URL: https://t.me/+0pAg9ymEhWdkZmNl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and validate tagged source
        shell: bash
        run: |
          set -euo pipefail
          git checkout v1.1.0.1
          VERSION=$(node -p "require('./extension/manifest.json').version")
          test "${VERSION}" = "1.1.0.1"
          npm run validate
          npm run build:release
          npm run build:edge
          npm run validate:edge

      - name: Package manual and Edge builds
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.1.0.1"
          (cd "dist/BMP-Terbuka-v${VERSION}" && zip -qr "../BMP-Terbuka-v${VERSION}.zip" .)
          (cd "dist/edge/BMP-Terbuka-v${VERSION}" && zip -qr "../../BMP-Terbuka-v${VERSION}-EDGE.zip" .)
          unzip -t "dist/BMP-Terbuka-v${VERSION}.zip"
          unzip -t "dist/BMP-Terbuka-v${VERSION}-EDGE.zip"
          test "$(unzip -Z1 "dist/BMP-Terbuka-v${VERSION}-EDGE.zip" | grep -xc 'manifest.json')" -eq 1
          sha256sum "dist/BMP-Terbuka-v${VERSION}.zip" > "dist/BMP-Terbuka-v${VERSION}.zip.sha256"
          sha256sum "dist/BMP-Terbuka-v${VERSION}-EDGE.zip" > "dist/BMP-Terbuka-v${VERSION}-EDGE.zip.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gh release view v1.1.0.1 --json tagName --jq .tagName 2>/dev/null || true)"
          gh release create "v1.1.0.1" \
            "dist/BMP-Terbuka-v1.1.0.1.zip" \
            "dist/BMP-Terbuka-v1.1.0.1.zip.sha256" \
            "dist/BMP-Terbuka-v1.1.0.1-EDGE.zip" \
            "dist/BMP-Terbuka-v1.1.0.1-EDGE.zip.sha256" \
            --verify-tag \
            --title "BMP Terbuka v1.1.0.1" \
            --generate-notes

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/release-v1.1.0.1-now.yml
          git commit -m "chore: remove completed v1.1.0.1 release workflow"
          git push origin HEAD:main
