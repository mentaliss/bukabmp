name: Store and Compatibility Candidate

on:
  push:
    branches:
      - "cws-candidate"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      BMP_API_BASE_URL: https://community.bukabmp.workers.dev
      BMP_TELEGRAM_CHANNEL_URL: https://t.me/bukabmp
      BMP_TELEGRAM_GROUP_URL: https://t.me/+0pAg9ymEhWdkZmNl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate shared source and cloud contract
        run: npm run validate

      - name: Build GitHub/manual compatibility package
        run: |
          npm run build:release
          npm run validate:github

      - name: Build Android compatibility package
        run: |
          npm run build:android
          npm run validate:android

      - name: Build CWS package
        run: |
          npm run build:cws
          npm run validate:cws

      - name: Build Edge Add-ons package
        run: |
          npm run build:edge
          npm run validate:edge

      - name: Create flat-root Store ZIPs
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")

          for CHANNEL in cws edge; do
            UPPER=$(printf '%s' "${CHANNEL}" | tr '[:lower:]' '[:upper:]')
            PKG="dist/${CHANNEL}/BMP-Terbuka-v${VERSION}"
            ZIP="dist/BMP-Terbuka-v${VERSION}-${UPPER}.zip"

            (
              cd "${PKG}"
              zip -qr "../../BMP-Terbuka-v${VERSION}-${UPPER}.zip" .
            )

            test "$(unzip -Z1 "${ZIP}" | grep -xc 'manifest.json')" -eq 1
            test "$(unzip -Z1 "${ZIP}" | grep -xc 'background.js')" -eq 1
            unzip -t "${ZIP}"
            sha256sum "${ZIP}" > "${ZIP}.sha256"
          done

      - name: Upload CWS candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmp-terbuka-cws-candidate
          path: |
            dist/BMP-Terbuka-v*-CWS.zip
            dist/BMP-Terbuka-v*-CWS.zip.sha256
          if-no-files-found: error

      - name: Upload Edge candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmp-terbuka-edge-candidate
          path: |
            dist/BMP-Terbuka-v*-EDGE.zip
            dist/BMP-Terbuka-v*-EDGE.zip.sha256
          if-no-files-found: error
