name: Release v1.1.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v110.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BMP_API_BASE_URL: https://community.bukabmp.workers.dev
      BMP_TELEGRAM_CHANNEL_URL: https://t.me/bukabmp
      BMP_TELEGRAM_GROUP_URL: https://t.me/+0pAg9ymEhWdkZmNl

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate final release source
        shell: bash
        run: |
          set -euo pipefail
          npm run validate
          test "$(node -p "require('./extension/manifest.json').version")" = "1.1.0"
          grep -Fq "## [1.1.0] - 2026-09-23" CHANGELOG.md
          ! grep -Fq "## [1.1.0] - Unreleased" CHANGELOG.md

      - name: Build stable manual package
        run: |
          npm run build:release
          npm run validate:github

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.1.0
          (
            cd "dist/BMP-Terbuka-v${VERSION}"
            zip -qr "../BMP-Terbuka-v${VERSION}.zip" .
          )
          test "$(unzip -Z1 "dist/BMP-Terbuka-v${VERSION}.zip" | grep -xc 'manifest.json')" -eq 1
          unzip -t "dist/BMP-Terbuka-v${VERSION}.zip"
          sha256sum "dist/BMP-Terbuka-v${VERSION}.zip" > "dist/BMP-Terbuka-v${VERSION}.zip.sha256"

      - name: Create v1.1.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "v1.1.0 release already exists; refusing duplicate release."
            exit 1
          fi

          gh release create v1.1.0             "dist/BMP-Terbuka-v1.1.0.zip"             "dist/BMP-Terbuka-v1.1.0.zip.sha256"             --target "$GITHUB_SHA"             --title "BMP Terbuka v1.1.0"             --generate-notes
