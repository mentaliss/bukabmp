name: One-shot v1.1.0.1 tag

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tag-v1.1.0.1.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag at source commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD^)"
          test "${TARGET}" = "62f9fc2e42f1c05fdf138c4fa8281962ba9dcd4c"
          VERSION="$(git show "${TARGET}:extension/manifest.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          test "${VERSION}" = "1.1.0.1"
          if git ls-remote --exit-code --tags origin "refs/tags/v1.1.0.1" >/dev/null 2>&1; then
            echo "Tag v1.1.0.1 already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v1.1.0.1" "${TARGET}" -m "BMP Terbuka v1.1.0.1"
          git push origin "v1.1.0.1"

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tag-v1.1.0.1.yml
          git commit -m "chore: remove completed v1.1.0.1 tag workflow"
          git push origin HEAD:main
