name: Bot V2 Candidate

on:
  push:
    branches: ["bot-v2-candidate"]
  pull_request:
    branches: ["cloudflare-worker-prod"]
    paths:
      - "worker/**"
      - "extension/cloud-surface.js"
      - "tests/cloud-surface.test.mjs"
      - ".github/workflows/bot-v2-candidate.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Existing repository validation
        run: node tools/validate.mjs
      - name: Existing Cloud Surface tests
        run: node tests/cloud-surface.test.mjs
      - name: Extension 1.1.0 regression tests
        run: node --test tests/*.test.mjs
      - name: Build and validate Android 1.1.0 candidate
        env:
          BMP_API_BASE_URL: https://community.bukabmp.workers.dev
          BMP_TELEGRAM_CHANNEL_URL: https://t.me/bukabmp
          BMP_TELEGRAM_GROUP_URL: https://t.me/+0pAg9ymEhWdkZmNl
        run: |
          npm run build:android
          npm run validate:android
      - name: Build and validate Edge 1.1.0 candidate
        env:
          BMP_API_BASE_URL: https://community.bukabmp.workers.dev
          BMP_TELEGRAM_CHANNEL_URL: https://t.me/bukabmp
          BMP_TELEGRAM_GROUP_URL: https://t.me/+0pAg9ymEhWdkZmNl
        run: |
          npm run build:edge
          npm run validate:edge
      - name: Upload Edge 1.1.0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: BMP-Terbuka-v1.1.0-EDGE-CANDIDATE-ACCOUNT-SYNC
          path: dist/edge/BMP-Terbuka-v1.1.0
          if-no-files-found: error
          compression-level: 9
      - name: Knowledge index check
        working-directory: worker
        run: node scripts/build-knowledge.mjs --check
      - name: Worker characterization tests
        run: node --test worker/tests/*.test.mjs
      - name: Worker bundle dry-run
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/bmp-worker-build
