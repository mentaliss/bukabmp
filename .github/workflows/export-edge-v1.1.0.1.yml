name: One-shot export Edge v1.1.0.1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/export-edge-v1.1.0.1.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact release Edge package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          gh release download v1.1.0.1 --pattern "BMP-Terbuka-v1.1.0.1-EDGE.zip" --dir export
          echo "9f8aa3cb604c1dbf473b35740118933dd4bb063e76add9883367e2bba2c0433e  export/BMP-Terbuka-v1.1.0.1-EDGE.zip" | sha256sum -c -
          unzip -t export/BMP-Terbuka-v1.1.0.1-EDGE.zip
          test "$(unzip -Z1 export/BMP-Terbuka-v1.1.0.1-EDGE.zip | grep -xc 'manifest.json')" -eq 1

      - name: Upload exact Edge package
        uses: actions/upload-artifact@v4
        with:
          name: bmp-terbuka-v1.1.0.1-edge-publish
          path: export/BMP-Terbuka-v1.1.0.1-EDGE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup merged branch and workflow
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin release-v1.1.0.1 >/dev/null 2>&1; then
            git push origin --delete release-v1.1.0.1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/export-edge-v1.1.0.1.yml
          git commit -m "chore: remove completed Edge export workflow"
          git push origin HEAD:main
